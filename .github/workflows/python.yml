name: Python

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCKER_VOLUME_PREFIX: ".docker/"
  # Registry time machine: resolve PyPI deps as of the 14.0.2 release date.
  PIP_INDEX_URL: "https://:2023-12-18T15:39:54.353237Z@time-machines-pypi.sealsecurity.io/"

jobs:

  docker:
    name: ${{ matrix.title }}
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.title, 'WIP') }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        name:
          - conda-python-docs
          - conda-python-3.9-nopandas
          - conda-python-3.8-pandas-1.0
          - conda-python-3.10-pandas-latest
        include:
          - name: conda-python-docs
            cache: conda-python-3.9
            image: conda-python-docs
            title: AMD64 Conda Python 3.9 Sphinx & Numpydoc
            python: 3.9
          - name: conda-python-3.9-nopandas
            cache: conda-python-3.9
            image: conda-python
            title: AMD64 Conda Python 3.9 Without Pandas
            python: 3.9
          - name: conda-python-3.8-pandas-1.0
            cache: conda-python-3.8
            image: conda-python-pandas
            title: AMD64 Conda Python 3.8 Pandas 1.0
            python: 3.8
            pandas: "1.0"
            numpy: 1.16
          - name: conda-python-3.10-pandas-latest
            cache: conda-python-3.10
            image: conda-python-pandas
            title: AMD64 Conda Python 3.10 Pandas latest
            python: "3.10"
            pandas: latest
    env:
      PYTHON: ${{ matrix.python || 3.8 }}
      UBUNTU: ${{ matrix.ubuntu || 20.04 }}
      PANDAS: ${{ matrix.pandas || 'latest' }}
      NUMPY: ${{ matrix.numpy || 'latest' }}
    steps:
      - name: Checkout Arrow
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Cache Docker Volumes
        uses: actions/cache@v3
        with:
          path: .docker
          key: ${{ matrix.cache }}-${{ hashFiles('cpp/**') }}
          restore-keys: ${{ matrix.cache }}-
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.8
      - name: Install docker-compose shim
        # ubuntu-24.04 runners ship only the compose v2 plugin; archery calls docker-compose.
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexec docker compose "$@"\n' > "$HOME/.local/bin/docker-compose"
          chmod +x "$HOME/.local/bin/docker-compose"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Setup Archery
        run: pip install -e dev/archery[docker]
      - name: Execute Docker Build
        env:
          ARCHERY_DOCKER_USER: ${{ secrets.DOCKERHUB_USER }}
          ARCHERY_DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          sudo sysctl -w kernel.core_pattern="core.%e.%p"
          ulimit -c unlimited
          archery docker run ${{ matrix.image }}

  macos:
    name: AMD64 macOS 12 Python 3
    runs-on: macos-latest
    if: ${{ !contains(github.event.pull_request.title, 'WIP') }}
    timeout-minutes: 60
    env:
      ARROW_HOME: /usr/local
      ARROW_DATASET: ON
      ARROW_FLIGHT: ON
      ARROW_GANDIVA: ON
      ARROW_GCS: OFF
      ARROW_HDFS: ON
      ARROW_JEMALLOC: ON
      ARROW_ORC: ON
      ARROW_PARQUET: ON
      PARQUET_REQUIRE_ENCRYPTION: ON
      ARROW_PYTHON: ON
      ARROW_S3: ON
      ARROW_SUBSTRAIT: ON
      ARROW_WITH_ZLIB: ON
      ARROW_WITH_LZ4: ON
      ARROW_WITH_BZ2: ON
      ARROW_WITH_ZSTD: ON
      ARROW_WITH_SNAPPY: ON
      ARROW_WITH_BROTLI: ON
      ARROW_BUILD_TESTS: OFF
      PYARROW_TEST_LARGE_MEMORY: ON
      # Current oldest supported version according to https://endoflife.date/macos
      MACOSX_DEPLOYMENT_TARGET: 10.15
    steps:
      - name: Checkout Arrow
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Dependencies
        shell: bash
        run: |
          brew bundle --file=cpp/Brewfile
          python -m pip install \
            -r python/requirements-build.txt \
            -r python/requirements-test.txt
      - name: Build
        shell: bash
        run: |
          python -m pip install wheel
          ci/scripts/cpp_build.sh $(pwd) $(pwd)/build
          ci/scripts/python_build.sh $(pwd) $(pwd)/build
      - name: Test
        shell: bash
        run: ci/scripts/python_test.sh $(pwd) $(pwd)/build

  # Release artifacts, rendered from the crossbow templates
  # dev/tasks/python-sdist/github.yml and dev/tasks/python-wheels/github.*.yml.
  sdist:
    name: "Build sdist"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Arrow
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: arrow
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install docker-compose shim
        # ubuntu-24.04 runners ship only the compose v2 plugin; archery calls docker-compose.
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexec docker compose "$@"\n' > "$HOME/.local/bin/docker-compose"
          chmod +x "$HOME/.local/bin/docker-compose"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Archery
        shell: bash
        run: pip install -e arrow/dev/archery[all]
      - name: Build sdist
        run: archery docker run -e PIP_INDEX_URL="$PIP_INDEX_URL" python-sdist
        env:
          PYARROW_VERSION: "14.0.2"
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: arrow/python/dist/*.tar.gz
          if-no-files-found: error

  linux:
    name: "Build wheel for manylinux ${{ matrix.manylinux_version }} ${{ matrix.arch }} py${{ matrix.python_version }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            manylinux_version: "2014"
            python_version: "3.10"
    env:
      # archery uses these environment variables
      ARCH: ${{ matrix.arch == 'amd64' && 'amd64' || 'arm64v8' }}
      PYTHON: "${{ matrix.python_version }}"
    steps:
      - name: Checkout Arrow
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: arrow
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install docker-compose shim
        # ubuntu-24.04 runners ship only the compose v2 plugin; archery calls docker-compose.
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexec docker compose "$@"\n' > "$HOME/.local/bin/docker-compose"
          chmod +x "$HOME/.local/bin/docker-compose"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Archery
        shell: bash
        run: pip install -e arrow/dev/archery[all]
      - name: Free up disk space
        shell: bash
        run: arrow/ci/scripts/util_free_space.sh
      - name: Build wheel
        shell: bash
        run: archery docker run -e SETUPTOOLS_SCM_PRETEND_VERSION=14.0.2 -e PIP_INDEX_URL="$PIP_INDEX_URL" python-wheel-manylinux-${{ matrix.manylinux_version }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-manylinux-${{ matrix.manylinux_version }}-${{ matrix.arch }}-${{ matrix.python_version }}
          path: arrow/python/repaired_wheels/*.whl
          if-no-files-found: error
      - name: Test wheel
        shell: bash
        run: |
          archery docker run -e PIP_INDEX_URL="$PIP_INDEX_URL" python-wheel-manylinux-test-imports
          archery docker run -e PIP_INDEX_URL="$PIP_INDEX_URL" python-wheel-manylinux-test-unittests
